composeFiles:
  primary: docker-compose.yml

envFiles:
  - path: .env

hosts:
  - svc-a.orca-fictorg.test

extensions:
  - name: env
    type: syncFile
    source: .env.example
    target: .env
    description: Create .env from .env.example

  - name: os-info
    service: svc-a
    command: cat /etc/os-release
    description: Show which OS the container runs

  - name: smoke
    command: ./scripts/smoke.sh
    description: Check svc-a answers through traefik

  # Wherever the workspace clones the sdk library, it's linked in here
  - name: link-sdk
    type: symlink
    source: "{{ .Projects.sdk.Path }}"
    target: vendor/sdk
    description: Link the sdk library into vendor

  - name: install-deps
    command: make deps
    description: Install svc-a's dependencies

hooks:
  clone:
    post:
      - extension: env
      - extension: link-sdk
      - extension: install-deps
  up:
    post:
      - extension: smoke
